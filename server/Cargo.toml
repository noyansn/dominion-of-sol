[package]
name = "project-dominion-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
socket2 = "0.5"



[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
test = false

[[bin]]
name = "population_audit"
path = "src/bin/population_audit.rs"
test = false

[[bin]]
name = "balance_harness"
path = "src/bin/balance_harness.rs"
test = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
