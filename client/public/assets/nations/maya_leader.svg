<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1024" width="100%" height="100%">
  <defs>
    <linearGradient id="mlBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="40%" stop-color="#064e3b"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="mlSkin" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c28552"/>
      <stop offset="60%" stop-color="#945831"/>
      <stop offset="100%" stop-color="#542e14"/>
    </radialGradient>
    <linearGradient id="mlJade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="mlFeather" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="30%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="mlJaguar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="768" height="1024" fill="url(#mlBg)"/>

  <!-- Carved Temple Wall in Background with Glyphs -->
  <rect x="50" y="160" width="668" height="520" fill="#064e3b" opacity="0.35" stroke="#10b981" stroke-width="2"/>
  <g fill="#022c22" stroke="#047857" stroke-width="1.5">
    <rect x="80" y="200" width="60" height="45" rx="4"/>
    <rect x="160" y="200" width="60" height="45" rx="4"/>
    <rect x="548" y="200" width="60" height="45" rx="4"/>
    <rect x="628" y="200" width="60" height="45" rx="4"/>
    <rect x="80" y="270" width="60" height="45" rx="4"/>
    <rect x="160" y="270" width="60" height="45" rx="4"/>
    <rect x="548" y="270" width="60" height="45" rx="4"/>
    <rect x="628" y="270" width="60" height="45" rx="4"/>
  </g>

  <!-- MAYA WAR COMMANDER / HALACH UINIC -->
  <!-- Jaguar Pelt Mantle -->
  <path d="M220,540 L548,580 L590,1024 L178,1024 Z" fill="url(#mlJaguar)"/>
  <!-- Jaguar Rosettes / Spots -->
  <g fill="#451a03">
    <circle cx="260" cy="620" r="10"/>
    <circle cx="310" cy="660" r="12"/>
    <circle cx="280" cy="740" r="11"/>
    <circle cx="480" cy="640" r="12"/>
    <circle cx="530" cy="700" r="10"/>
    <circle cx="500" cy="790" r="13"/>
    <circle cx="250" cy="850" r="12"/>
    <circle cx="340" cy="920" r="11"/>
    <circle cx="460" cy="900" r="12"/>
    <circle cx="520" cy="940" r="10"/>
  </g>

  <!-- Muscular Torso -->
  <ellipse cx="384" cy="560" rx="140" ry="120" fill="url(#mlSkin)"/>

  <!-- Monumental Green Jade Pectoral Collar -->
  <ellipse cx="384" cy="510" rx="130" ry="65" fill="url(#mlJade)" stroke="#f59e0b" stroke-width="4"/>
  <ellipse cx="384" cy="510" rx="100" ry="45" fill="#047857"/>
  <!-- Golden Solar Center -->
  <circle cx="384" cy="525" r="26" fill="#f59e0b"/>
  <circle cx="384" cy="525" r="18" fill="#10b981"/>

  <!-- Neck -->
  <rect x="344" y="440" width="80" height="80" fill="#783c19"/>

  <!-- Head & Face -->
  <ellipse cx="384" cy="380" rx="74" ry="92" fill="url(#mlSkin)"/>

  <!-- Ceremonial Red War Paint -->
  <path d="M330,360 L375,390 L370,405 L325,375 Z" fill="#dc2626"/>
  <path d="M438,360 L393,390 L398,405 L443,375 Z" fill="#dc2626"/>

  <!-- Intense Eyes -->
  <rect x="338" y="365" width="24" height="11" fill="#fff" rx="3"/>
  <rect x="404" y="365" width="24" height="11" fill="#fff" rx="3"/>
  <circle cx="350" cy="370" r="5.5" fill="#1c1917"/>
  <circle cx="416" cy="370" r="5.5" fill="#1c1917"/>

  <!-- Strong Nose & Aristocratic Contours -->
  <polygon points="384,355 380,410 390,410" fill="#663412"/>

  <!-- Large Round Jade Ear Spools -->
  <circle cx="298" cy="395" r="20" fill="#10b981" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="470" cy="395" r="20" fill="#10b981" stroke="#f59e0b" stroke-width="3"/>

  <!-- MONUMENTAL QUETZAL FEATHER HEADDRESS -->
  <!-- Golden Brow Band -->
  <rect x="290" y="300" width="188" height="34" fill="#d97706" stroke="#10b981" stroke-width="3" rx="4"/>
  <!-- Carved Jaguar Mask on Headdress -->
  <polygon points="340,300 428,300 410,230 384,215 358,230" fill="#047857" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="370" cy="255" r="5" fill="#fbbf24"/>
  <circle cx="398" cy="255" r="5" fill="#fbbf24"/>

  <!-- Radiant Crown of Quetzal Feathers -->
  <g stroke="url(#mlFeather)" stroke-width="7" stroke-linecap="round">
    <line x1="384" y1="215" x2="384" y2="40"/>
    <line x1="375" y1="220" x2="330" y2="50"/>
    <line x1="393" y1="220" x2="438" y2="50"/>
    <line x1="365" y1="230" x2="280" y2="70"/>
    <line x1="403" y1="230" x2="488" y2="70"/>
    <line x1="355" y1="245" x2="230" y2="105"/>
    <line x1="413" y1="245" x2="538" y2="105"/>
    <line x1="345" y1="265" x2="190" y2="155"/>
    <line x1="423" y1="265" x2="578" y2="155"/>
    <line x1="335" y1="290" x2="160" y2="215"/>
    <line x1="433" y1="290" x2="608" y2="215"/>
  </g>

  <!-- Obsidian-Bladed Macuahuitl (War Club Held in Hand) -->
  <rect x="180" y="440" width="38" height="420" fill="#78350f" stroke="#451a03" stroke-width="3"/>
  <!-- Obsidian Prismatic Razor Blades along edges -->
  <g fill="#020617" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5">
    <polygon points="180,470 156,480 180,495"/>
    <polygon points="180,515 156,525 180,540"/>
    <polygon points="180,560 156,570 180,585"/>
    <polygon points="180,605 156,615 180,630"/>
    <polygon points="180,650 156,660 180,675"/>
    <polygon points="180,695 156,705 180,720"/>

    <polygon points="218,470 242,480 218,495"/>
    <polygon points="218,515 242,525 218,540"/>
    <polygon points="218,560 242,570 218,585"/>
    <polygon points="218,605 242,615 218,630"/>
    <polygon points="218,650 242,660 218,675"/>
    <polygon points="218,695 242,705 218,720"/>
  </g>
</svg>
