<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1024" width="100%" height="100%">
  <defs>
    <linearGradient id="nSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040d1a"/>
      <stop offset="35%" stop-color="#092138"/>
      <stop offset="65%" stop-color="#0d1c2b"/>
      <stop offset="100%" stop-color="#040910"/>
    </linearGradient>
    <linearGradient id="nAurora1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10ffa0" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10ffa0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nChainmail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="nSkin" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="60%" stop-color="#9a6e50"/>
      <stop offset="100%" stop-color="#583925"/>
    </radialGradient>
    <linearGradient id="nBeard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d6be96"/>
      <stop offset="35%" stop-color="#b8a178"/>
      <stop offset="70%" stop-color="#806e50"/>
      <stop offset="100%" stop-color="#4a3e2b"/>
    </linearGradient>
    <linearGradient id="nAxeBlade" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="nGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky & Night -->
  <rect width="768" height="1024" fill="url(#nSky)"/>

  <!-- Aurora Borealis Ribbons -->
  <path d="M0,140 Q220,60 480,180 T768,110 L768,320 Q540,240 280,340 T0,260 Z" fill="url(#nAurora1)" filter="url(#nGlow)"/>
  <path d="M0,200 Q300,120 560,240 T768,180 L768,380 Q480,300 200,400 T0,320 Z" fill="url(#nAurora1)" opacity="0.6" filter="url(#nGlow)"/>

  <!-- Jagged Snowy Fjord Peaks -->
  <polygon points="0,520 70,440 150,470 250,370 360,430 480,340 580,410 670,360 768,440 768,660 0,660" fill="#0b1a28"/>
  <!-- Snowcaps -->
  <polygon points="250,370 280,415 230,420" fill="#bae6fd" opacity="0.6"/>
  <polygon points="480,340 520,395 450,400" fill="#bae6fd" opacity="0.6"/>
  <polygon points="670,360 700,405 645,410" fill="#bae6fd" opacity="0.6"/>

  <!-- Fjord Water -->
  <rect y="520" width="768" height="200" fill="#06121e"/>
  <!-- Distant Viking Longship -->
  <path d="M570,555 Q610,563 650,555 L654,548 L610,550 Z" fill="#03080e"/>
  <line x1="610" y1="520" x2="610" y2="550" stroke="#03080e" stroke-width="2"/>
  <rect x="600" y="525" width="20" height="15" fill="#b91c1c" opacity="0.8"/>

  <!-- VIKING JARL PORTRAIT -->
  <!-- Fur Mantle Backing -->
  <ellipse cx="384" cy="540" rx="300" ry="170" fill="#171310"/>
  <ellipse cx="384" cy="540" rx="280" ry="155" fill="#2d241e"/>
  <ellipse cx="384" cy="540" rx="260" ry="140" fill="#44372e" opacity="0.8"/>

  <!-- Chainmail Torso -->
  <path d="M220,580 L548,580 L590,1024 L178,1024 Z" fill="url(#nChainmail)"/>

  <!-- Crossed Leather Harness -->
  <line x1="230" y1="590" x2="520" y2="920" stroke="#29180c" stroke-width="28"/>
  <line x1="538" y1="590" x2="248" y2="920" stroke="#29180c" stroke-width="28"/>
  <!-- Central Bronze Medallion -->
  <rect x="360" y="730" width="48" height="48" fill="#d97706" rx="6"/>
  <circle cx="384" cy="754" r="16" fill="#78350f"/>

  <!-- Neck -->
  <rect x="339" y="470" width="90" height="85" fill="#784828"/>

  <!-- Face -->
  <ellipse cx="384" cy="400" rx="76" ry="96" fill="url(#nSkin)"/>

  <!-- Intense Eyes -->
  <rect x="338" y="380" width="26" height="11" fill="#f0f9ff" rx="3"/>
  <rect x="404" y="380" width="26" height="11" fill="#f0f9ff" rx="3"/>
  <circle cx="351" cy="385" r="6" fill="#38bdf8"/>
  <circle cx="417" cy="385" r="6" fill="#38bdf8"/>
  <circle cx="351" cy="385" r="2.5" fill="#020617"/>
  <circle cx="417" cy="385" r="2.5" fill="#020617"/>

  <!-- Furrowed Brow -->
  <path d="M330,372 L375,378 L370,366 Z" fill="#3b2b1a"/>
  <path d="M438,372 L393,378 L398,366 Z" fill="#3b2b1a"/>

  <!-- Battle Scar -->
  <line x1="346" y1="360" x2="358" y2="420" stroke="#7c2d12" stroke-width="3" opacity="0.8"/>

  <!-- Flowing Blonde/Silver Hair -->
  <path d="M308,350 C260,420 260,560 310,640 L340,540 Z" fill="#a38c6b"/>
  <path d="M460,350 C508,420 508,560 458,640 L428,540 Z" fill="#a38c6b"/>

  <!-- Steel Eyebrow Circlet / Helm -->
  <path d="M304,360 Q384,330 464,360 L468,320 Q384,290 300,320 Z" fill="#475569" stroke="#d97706" stroke-width="4"/>

  <!-- Braided Beard -->
  <path d="M315,410 Q305,560 355,680 L413,680 Q463,560 453,410 Z" fill="url(#nBeard)"/>
  <line x1="365" y1="460" x2="365" y2="670" stroke="#382c1e" stroke-width="3"/>
  <line x1="403" y1="460" x2="403" y2="670" stroke="#382c1e" stroke-width="3"/>
  <!-- Bronze Beard Rings -->
  <rect x="357" y="570" width="16" height="12" fill="#d97706" rx="2"/>
  <rect x="395" y="570" width="16" height="12" fill="#d97706" rx="2"/>
  <rect x="376" y="640" width="16" height="12" fill="#d97706" rx="2"/>

  <!-- Forehand Gripping Viking Battle Axe -->
  <line x1="560" y1="280" x2="460" y2="1024" stroke="#3e2410" stroke-width="24"/>
  <!-- Axe Blade Head -->
  <path d="M545,350 L665,320 Q695,430 670,490 L545,440 Z" fill="url(#nAxeBlade)"/>
  <!-- Sharp Blade Edge -->
  <path d="M665,320 Q695,430 670,490" stroke="#ffffff" stroke-width="4" fill="none"/>

  <!-- Snowfall Particles -->
  <circle cx="120" cy="180" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="280" cy="90" r="3" fill="#fff" opacity="0.9"/>
  <circle cx="490" cy="150" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="650" cy="240" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="200" cy="420" r="2.5" fill="#fff" opacity="0.7"/>
  <circle cx="580" cy="460" r="3.5" fill="#fff" opacity="0.9"/>
  <circle cx="160" cy="690" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="670" cy="740" r="3" fill="#fff" opacity="0.85"/>
</svg>
