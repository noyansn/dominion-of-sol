<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768" width="100%" height="100%">
  <defs>
    <linearGradient id="mDawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="25%" stop-color="#f43f5e"/>
      <stop offset="55%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="mSun" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#fb923c" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mPyramid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="48%" stop-color="#cbd5e1"/>
      <stop offset="52%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="mStairs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="mJungle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#02140e"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1366" height="768" fill="url(#mDawn)"/>

  <!-- Rising Tropical Sun -->
  <circle cx="683" cy="220" r="240" fill="url(#mSun)"/>

  <!-- Distant Jungle Mountain Ridges -->
  <path d="M0,320 Q200,260 420,330 T880,310 Q1120,270 1366,330 L1366,768 L0,768 Z" fill="#042f2e" opacity="0.8"/>
  <path d="M0,370 Q240,310 500,380 T1000,360 Q1200,320 1366,380 L1366,768 L0,768 Z" fill="#064e3b" opacity="0.9"/>

  <!-- Rainforest Canopy & Palm Silhouettes -->
  <g fill="#022c22">
    <ellipse cx="140" cy="420" rx="90" ry="45"/>
    <ellipse cx="280" cy="410" rx="110" ry="50"/>
    <ellipse cx="450" cy="430" rx="95" ry="40"/>
    <ellipse cx="910" cy="420" rx="105" ry="50"/>
    <ellipse cx="1080" cy="410" rx="120" ry="55"/>
    <ellipse cx="1240" cy="430" rx="100" ry="45"/>
  </g>

  <!-- STEPPED PYRAMID OF KUKULKAN -->
  <!-- 9 Stepped Tiers -->
  <g fill="url(#mPyramid)">
    <rect x="363" y="470" width="640" height="26"/>
    <rect x="395" y="444" width="576" height="26"/>
    <rect x="427" y="418" width="512" height="26"/>
    <rect x="459" y="392" width="448" height="26"/>
    <rect x="491" y="366" width="384" height="26"/>
    <rect x="523" y="340" width="320" height="26"/>
    <rect x="555" y="314" width="256" height="26"/>
    <rect x="587" y="288" width="192" height="26"/>
    <rect x="619" y="262" width="128" height="26"/>
  </g>

  <!-- Stone masonry joints -->
  <g stroke="rgba(15, 23, 42, 0.4)" stroke-width="1.5">
    <line x1="363" y1="470" x2="1003" y2="470"/>
    <line x1="395" y1="444" x2="971" y2="444"/>
    <line x1="427" y1="418" x2="939" y2="418"/>
    <line x1="459" y1="392" x2="907" y2="392"/>
    <line x1="491" y1="366" x2="875" y2="366"/>
    <line x1="523" y1="340" x2="843" y2="340"/>
    <line x1="555" y1="314" x2="811" y2="314"/>
    <line x1="587" y1="288" x2="779" y2="288"/>
    <line x1="619" y1="262" x2="747" y2="262"/>
  </g>

  <!-- Central Monumental Staircase -->
  <polygon points="663,262 703,262 733,496 633,496" fill="url(#mStairs)"/>
  <!-- Steps Lines -->
  <g stroke="#334155" stroke-width="1.2">
    <line x1="660" y1="285" x2="706" y2="285"/>
    <line x1="657" y1="310" x2="709" y2="310"/>
    <line x1="654" y1="335" x2="712" y2="335"/>
    <line x1="651" y1="360" x2="715" y2="360"/>
    <line x1="648" y1="385" x2="718" y2="385"/>
    <line x1="645" y1="410" x2="721" y2="410"/>
    <line x1="642" y1="435" x2="724" y2="435"/>
    <line x1="639" y1="460" x2="727" y2="460"/>
    <line x1="636" y1="485" x2="730" y2="485"/>
  </g>
  <!-- Feathered Serpent Head at Base of Stairs -->
  <rect x="625" y="492" width="16" height="14" fill="#1e293b" rx="2"/>
  <rect x="725" y="492" width="16" height="14" fill="#1e293b" rx="2"/>

  <!-- Top Temple Sanctuary -->
  <rect x="635" y="212" width="96" height="50" fill="#e2e8f0"/>
  <rect x="630" y="206" width="106" height="8" fill="#cbd5e1"/>
  <!-- Temple Portals -->
  <rect x="647" y="228" width="16" height="34" fill="#020617"/>
  <rect x="675" y="225" width="16" height="37" fill="#020617"/>
  <rect x="703" y="228" width="16" height="34" fill="#020617"/>

  <!-- Foreground Plaza & Jungle Floor -->
  <rect y="496" width="1366" height="272" fill="url(#mJungle)"/>

  <!-- Carved Stone Stelae in Foreground -->
  <rect x="220" y="470" width="38" height="150" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <rect x="230" y="485" width="18" height="18" fill="#1e293b"/>
  <rect x="230" y="515" width="18" height="18" fill="#1e293b"/>
  <rect x="230" y="545" width="18" height="18" fill="#1e293b"/>
  <rect x="230" y="575" width="18" height="18" fill="#1e293b"/>

  <rect x="1100" y="460" width="42" height="165" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <rect x="1112" y="480" width="18" height="20" fill="#1e293b"/>
  <rect x="1112" y="515" width="18" height="20" fill="#1e293b"/>
  <rect x="1112" y="550" width="18" height="20" fill="#1e293b"/>
  <rect x="1112" y="585" width="18" height="20" fill="#1e293b"/>

  <!-- Foreground Lush Rainforest Ferns & Tropical Plants -->
  <g stroke="#059669" stroke-width="3" fill="none">
    <path d="M60,768 Q120,660 160,620"/>
    <path d="M80,768 Q140,680 190,650"/>
    <path d="M40,768 Q90,690 120,670"/>
    <path d="M1280,768 Q1220,660 1180,620"/>
    <path d="M1310,768 Q1250,680 1200,650"/>
    <path d="M1340,768 Q1290,690 1260,670"/>
  </g>
</svg>
